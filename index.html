<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <h2>To-Do List</h2>
        <div class="user-info">
            Welcome, <span id="username"></span> | <a href="/logout">Logout</a>
        </div>
    </header>

<table id="todoList">
    <thead>
        <tr>
            <th>ID</th>
            <th>Text</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('listBody').addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-btn')) {
                startEdit(e.target.closest('tr'));
            }
        });
    });

    function startEdit(row) {
        const id = row.dataset.id;
        const textCell = row.querySelector('.item-text');
        const originalText = textCell.textContent;

        // Switch to edit mode
        row.classList.add('edit-mode');
        textCell.innerHTML = `
            <input type="text" class="edit-input" value="${originalText}">
            <button class="save-btn">Save</button>
            <button class="cancel-btn">Cancel</button>
        `;

        // Focus the input field
        textCell.querySelector('.edit-input').focus();

        // Handle save
        textCell.querySelector('.save-btn').addEventListener('click', async () => {
            const newText = textCell.querySelector('.edit-input').value.trim();
            if (newText && newText !== originalText) {
                try {
                    const response = await fetch('/update', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `id=${id}&text=${encodeURIComponent(newText)}`
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) {
                            window.location.reload();
                        } else {
                            alert('Error updating item');
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to update item');
                }
            }
            cancelEdit(row, originalText);
        });

        // Handle cancel
        textCell.querySelector('.cancel-btn').addEventListener('click', () => {
            cancelEdit(row, originalText);
        });
    }

    function cancelEdit(row, originalText) {
        row.classList.remove('edit-mode');
        const textCell = row.querySelector('.item-text');
        textCell.textContent = originalText;
    }
            document.addEventListener('DOMContentLoaded', () => {
            // Получаем имя пользователя из куки
            const cookies = document.cookie.split(';').reduce((cookies, cookie) => {
                const [name, value] = cookie.split('=').map(c => c.trim());
                cookies[name] = value;
                return cookies;
            }, {});

            if (cookies.username) {
                document.getElementById('username').textContent = cookies.username;
            }
        });
</script>

</body>
</html>
